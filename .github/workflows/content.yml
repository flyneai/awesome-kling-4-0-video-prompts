name: Content checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_brand_sections.py --check
      - run: python3 scripts/build_gallery.py --check
      - run: python3 scripts/check_content.py
      - run: git diff --check
